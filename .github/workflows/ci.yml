name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  integration:
    name: cgroup integration tests (sudo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: sudo go test (root required for cgroup v2 writes)
        run: sudo env "PATH=$PATH" go test -v ./test/...
